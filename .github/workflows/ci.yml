name: Research verification
on:
  push:
  pull_request:
jobs:
  python-exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install graph-atlas dependency
        run: python -m pip install 'networkx>=3.4,<4' 'sympy>=1.13,<2'
      - name: Exact tests
        run: python -m unittest discover -s tests -v
      - name: Exact demo
        run: python experiments/exact.py
      - name: Certified connected-graph atlas
        run: python experiments/census.py --max-n 6 --max-rate 4
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: true
