name: Research verification
on:
  push:
  pull_request:
jobs:
  python-exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install graph-atlas dependency
        run: python -m pip install 'networkx>=3.4,<4' 'sympy>=1.13,<2' 'PyYAML==6.0.2' 'jsonschema==4.23.0'
      - name: Exact tests
        run: python -m unittest discover -s tests -v
      - name: Exact demo
        run: python experiments/exact.py
      - name: Certified connected-graph atlas
        run: python experiments/census.py --max-n 6 --max-rate 4
      - name: Palomar source requirements
        run: python scripts/check-lean-sources.py
      - name: Palomar static preflight
        run: python experiments/palomar_preflight.py
      - name: Official v0.4 formalization schema
        run: python scripts/validate_formalization.py
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: true
      # The PR's exact commit must pass the same independent proof checker
      # as the staged branch, not just compile the local proof modules.
      - name: Compare independent Challenge and proved Solution
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: |
          lake env lean Challenge.lean
          lake env lean Solution.lean
      - name: Install Comparator sandbox dependency
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: Independent-kernel comparator (NanoDa and con-ron)
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: bash scripts/verify-comparator.sh
