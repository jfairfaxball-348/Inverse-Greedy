name: S047 Palomar official full mechanical preflight
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/palomar-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  palomar-full-preflight:
    # Pin the official workflow AND its pipeline_commit to the same immutable SHA.
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: s047formal01
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
