name = "InverseGreedy"
version = "0.1.0"
defaultTargets = ["InverseGreedy", "Challenge", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

[[lean_lib]]
name = "InverseGreedy"

# Palomar's comparator builds these named Lake modules, not just source files.
# The independent Challenge contains one deliberate theorem hole; Solution
# supplies its proof via the pinned, imported local development.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
