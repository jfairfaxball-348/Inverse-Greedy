related_formalizations: []

status:
  scope: >-
    Statement and imported solution concern every symmetric irreflexive
    neighbour map on Fin n for n<=5, including n=0, with a genuine independent
    exponential-clock product measure and strictly positive real rates. The
    path P5 is excluded only under full graph isomorphism. Does not classify
    six-vertex graphs; 90 EGU/8 non-EGU/45 unresolved connected classes through
    six vertices are separate previous work. All-m star-corona approximate
    EGU and complete six-vertex orbit exhaustiveness are not formally proved.
    The Challenge has one intentional theorem hole, excluded from proof counts.
    This metadata is staged pending successful full Comparator, kernel and
    independent review checks; it is not proof of Palomar registration.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - "PalomarEGU.graphs_le_five_iff"

automation:
  methods:
    - method: "agent"
      models: ["GPT-6"]
      framework: "ChatGPT and GitHub Actions"
      tool_setup: >-
        AI-assisted formalization, shell-based CI migration and targeted Lean
        proof debugging, with the formal Lean kernel intended as final checker.
      cost:
        wall_time: "Not tracked across research sessions"
        spend_usd: "Not tracked; subscription-based assistant"
        hardware: "GitHub Actions Linux runners; model API execution"
      prompting_notes: >-
        Owner requested a Palomar-first registration of an existing Lean-proved
        theorem, faithful genuine-clock and strict positive-rate semantics,
        independent Challenge declarations, and full kernel/Comparator checks.
  spend_usd: "Not tracked"
  notes: >-
    Human-directed research project with AI-assisted code, proof discovery
    and verification. The complete historical model-use inventory and actual
    machine effort were not independently audited. No external mathematical
    referee has reviewed this submitted wrapper as of this staging.

fidelity:
  divergences: >-
    No intentional mathematical weakening: actual independent real Exp(rate)
    product measures, the deterministic tie-broken greedy output, all maximal
    independent sets, strict rate positivity, and full P5 isomorphism are
    preserved. Whether the separately defined challenge interface is
    definitionally matched to the existing imported development remains
    contingent on successful Comparator verification.

review:
  status: "self-assessed; independent Palomar review pending"
  reviewers: []
  notes: >-
    Historical Lean build and bounded exact checks do not constitute
    Comparator certification or a mathematical novelty certificate.
    Current staged files must pass lean, axiom inspection and both independent
    kernels before owner-initiated submission.

alignment:
  namespace: "PalomarEGU"
  statements:
