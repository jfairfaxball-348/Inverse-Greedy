version: "v0.4"

project:
  name: "Inverse Greedy — five-vertex exponential-clock uniformity classification"
  description: >-
    Formal classification of positive-rate independent exponential-clock random
    greedy maximal-independent-set uniformity for all finite simple graphs on
    at most five vertices: exactly the five-vertex path is excluded, up to
    graph isomorphism.
  authors:
    - "John Fairfax-Ball"
  license: "Apache-2.0"
  responsible_maintainers:
    - "John Fairfax-Ball"

classification:
  arxiv: ["math.CO", "math.PR"]
  msc2020: ["05C85", "60C05"]

