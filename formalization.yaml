    location: "InverseGreedy/SmallGraphClassification.lean and InverseGreedy/RealClockGreedyLaw.lean"
    relationship: "adapts"
    note: >-
      The public Challenge/Solution repackages the existing imported Lean
      classification under independent mathematical definitions. This record
      does not assert novelty or independent priority certification.
    license: "Apache-2.0"
    author_endorsement: "participated"
