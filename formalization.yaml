fidelity:
  divergences: >-
    No intentional mathematical weakening: actual independent real Exp(rate)
    product measures, the deterministic tie-broken greedy output, all maximal
    independent sets, strict rate positivity, and full P5 isomorphism are
    preserved. The official Comparator accepted the correspondence between
    Challenge and Solution at source commit
    a77a61228e0159a37b2ddc292b09ead86eacdda5. This metadata correction
    changes neither interface nor proof and is not itself a new verification.

