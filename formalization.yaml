related_formalizations: []

status:
  scope: >-
    Statement and imported solution concern every symmetric irreflexive
    neighbour map on Fin n for n<=5, including n=0, with a genuine independent
    exponential-clock product measure and strictly positive real rates. The
    path P5 is excluded only under full graph isomorphism. Does not classify
    six-vertex graphs; 90 EGU/8 non-EGU/45 unresolved connected classes through
    six vertices are separate previous work. All-m star-corona approximate
    EGU and complete six-vertex orbit exhaustiveness are not formally proved.
    The Challenge has one intentional theorem hole, excluded from proof counts.
    The Challenge/Solution comparison passed the official Comparator and
    independent Lean, NanoDa and con-ron kernel checks on 2026-11-19 at source
    commit a77a61228e0159a37b2ddc292b09ead86eacdda5. The automated Palomar
    editorial review of that submission reported no blocking problems and a
    correctable stale-status warning. This metadata-only update neither changes
    the formal statement nor establishes a new Palomar verification or public
    registration; the revised commit requires its own submission checks.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "PalomarEGU.graphs_le_five_iff"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

